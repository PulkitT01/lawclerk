[project]
name = "lawclerk"
version = "0.1.0"
description = "Research agent for German energy law that verifies every citation"
readme = "README.md"
authors = [
    { name = "PulkitT01", email = "85827394+PulkitT01@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
lawclerk = "lawclerk:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
